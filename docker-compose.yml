version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tv_guide
      POSTGRES_USER: tv
      POSTGRES_PASSWORD: tv
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tv']
      interval: 5s
      retries: 5

  app:
    build: .
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://tv:tv@db:5432/tv_guide
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npm run db:setup && npm start"

volumes:
  pgdata:
